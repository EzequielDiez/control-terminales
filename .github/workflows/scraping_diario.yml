name: Scraping Diario Terminales

on:
  schedule:
    # 12:00 UTC equivale a las 09:00 AM hora de Argentina (UTC-3)
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  scraping:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python con caché de pip
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Guarda en caché paquetes de Python entre corridas

      - name: Instalar dependencias de Python
        run: |
          pip install pandas playwright

      - name: Caché de navegadores Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}

      - name: Instalar navegador Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          playwright install chromium

      - name: Ejecutar Scraper de COFCO
        env:
          COFCO_USER: ${{ secrets.COFCO_USER }}
          COFCO_PASS: ${{ secrets.COFCO_PASS }}
        run: python scraper/cofco_scraper.py

      - name: Ejecutar Scraper de Cargill
        env:
          CARGILL_USER: ${{ secrets.CARGILL_USER }}
          CARGILL_PASS: ${{ secrets.CARGILL_PASS }}
        run: python scraper/cargill_scraper.py

      - name: Guardar y subir datos actualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.csv
          git commit -m "Auto-actualización de datos CSV (9:00 AM)" || exit 0
          git push