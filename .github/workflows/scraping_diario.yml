name: Scraping Diario Terminales

on:
  workflow_dispatch: # Disparado por cron-job.org (9:00 AM) o manualmente desde Streamlit / GitHub

jobs:
  scraping:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python con caché de pip
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias de Python
        run: |
          pip install pandas playwright

      - name: Instalar navegador Chromium y dependencias del sistema
        run: |
          playwright install --with-deps chromium

      - name: Ejecutar Scraper de COFCO
        id: step_cofco
        continue-on-error: true
        env:
          COFCO_USER: ${{ secrets.COFCO_USER }}
          COFCO_PASS: ${{ secrets.COFCO_PASS }}
        run: python scraper/cofco_scraper.py

      - name: Ejecutar Scraper de Cargill
        id: step_cargill
        continue-on-error: true
        env:
          CARGILL_USER: ${{ secrets.CARGILL_USER }}
          CARGILL_PASS: ${{ secrets.CARGILL_PASS }}
        run: python scraper/cargill_scraper.py

      - name: Ejecutar Scraper de Bunge
        id: step_bunge
        continue-on-error: true
        env:
          BUNGE_USER: ${{ secrets.BUNGE_USER }}
          BUNGE_PASS: ${{ secrets.BUNGE_PASS }}
        run: python scraper/bunge_scraper.py

      - name: Registrar estado y fecha de última ejecución
        env:
          OUTCOME_COFCO: ${{ steps.step_cofco.outcome }}
          OUTCOME_CARGILL: ${{ steps.step_cargill.outcome }}
          OUTCOME_BUNGE: ${{ steps.step_bunge.outcome }}
        run: |
          python -c "
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          ahora = datetime.now(ZoneInfo('America/Argentina/Buenos_Aires')).strftime('%d/%m/%Y %H:%M hs')
          estado = {
              'ultima_ejecucion': ahora,
              'COFCO': {'ok': os.getenv('OUTCOME_COFCO') == 'success', 'fecha': ahora},
              'Cargill': {'ok': os.getenv('OUTCOME_CARGILL') == 'success', 'fecha': ahora},
              'Bunge': {'ok': os.getenv('OUTCOME_BUNGE') == 'success', 'fecha': ahora}
          }
          with open('estado_scrapers.json', 'w', encoding='utf-8') as f:
              json.dump(estado, f, ensure_ascii=False, indent=2)
          "

      - name: Guardar y subir datos actualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.csv estado_scrapers.json
          git commit -m "Auto-actualización de datos CSV y estado" || exit 0
          git push

      - name: Mantener activa la webapp de Streamlit
        run: |
          curl -s "https://control-terminales-hl.streamlit.app" > /dev/null
