name: Scraping Diario Terminales

on:
  schedule:
    # 11:43 UTC equivale a las 08:43 AM hora de Argentina (evita la cola del minuto :00)
    - cron: '43 11 * * *'
  workflow_dispatch: # Permite probar el scraping manualmente con un clic en GitHub

jobs:
  scraping:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python con caché de pip
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias de Python
        run: |
          pip install pandas playwright

      - name: Instalar navegador Chromium y dependencias del sistema
        run: |
          playwright install --with-deps chromium

      - name: Ejecutar Scraper de COFCO
        env:
          COFCO_USER: ${{ secrets.COFCO_USER }}
          COFCO_PASS: ${{ secrets.COFCO_PASS }}
        run: python scraper/cofco_scraper.py

      - name: Ejecutar Scraper de Cargill
        env:
          CARGILL_USER: ${{ secrets.CARGILL_USER }}
          CARGILL_PASS: ${{ secrets.CARGILL_PASS }}
        run: python scraper/cargill_scraper.py

      - name: Guardar y subir datos actualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.csv
          git commit -m "Auto-actualización de datos CSV (8:43 AM)" || exit 0
          git push
