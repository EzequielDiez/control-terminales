name: Scraping Diario Terminales

on:
  workflow_dispatch: # Disparado por cron-job.org (9:00 AM) o manualmente desde Streamlit / GitHub

jobs:
  scraping:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python con caché de pip
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias de Python
        run: |
          pip install pandas playwright

      - name: Instalar navegador Chromium y dependencias del sistema
        run: |
          playwright install --with-deps chromium

      - name: Ejecutar Scraper de COFCO
        continue-on-error: true
        env:
          COFCO_USER: ${{ secrets.COFCO_USER }}
          COFCO_PASS: ${{ secrets.COFCO_PASS }}
        run: python scraper/cofco_scraper.py

      - name: Ejecutar Scraper de Cargill
        continue-on-error: true
        env:
          CARGILL_USER: ${{ secrets.CARGILL_USER }}
          CARGILL_PASS: ${{ secrets.CARGILL_PASS }}
        run: python scraper/cargill_scraper.py

      - name: Ejecutar Scraper de Bunge
        continue-on-error: true
        env:
          BUNGE_USER: ${{ secrets.BUNGE_USER }}
          BUNGE_PASS: ${{ secrets.BUNGE_PASS }}
        run: python scraper/bunge_scraper.py

      - name: Guardar y subir datos actualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.csv screenshots/*.png
          git commit -m "Auto-actualización de datos CSV y capturas" || exit 0
          git push

      - name: Mantener activa la webapp de Streamlit
        run: |
          curl -s "https://control-terminales-hl.streamlit.app" > /dev/null
